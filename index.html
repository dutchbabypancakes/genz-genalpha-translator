<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gen Z Translator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      left: 24px;
    }

    .logo {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.5px;
      cursor: default;
    }

    .blue { color: #4285F4; }
    .red { color: #EA4335; }
    .yellow { color: #FBBC05; }
    .green { color: #34A853; }

    .translate-text {
      color: #5f6368;
    }

    /* Main card */
    .card {
      margin: 120px 700px 300px 50px;
      background: white;
      padding: 24px;
      width: 500px;
      height: 500px;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      text-align: left;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      font-size: 18px;
      border: none;
      resize: none;
      outline: none;
      font-family: inherit;
      background: #f8f9fa;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e8f0fe;
      color: #4285f4;
      border-style: solid;
      border-color: #4285f4;
    }

    .output {
      margin-top: 16px;
      font-size: 18px;
      color: #202124;
      min-height: 40px;
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <div class="top-bar">
    <div class="logo">
      <span class="blue">G</span>
      <span class="red">e</span>
      <span class="yellow">n</span>
      <span class="blue">Z</span>
      <span class="translate-text"> Translate</span>
    </div>
  </div>

  <!-- Translator card -->
  <div class="card">
    <textarea id="inputText" placeholder="Type Gen Z slang here"></textarea>
    <button id="translateBtn">Translate</button>
    <div class="output" id="outputText"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
