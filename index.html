<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen Z Translator</title>
  <style>
    body { font-family: Arial, sans-serif; 
          text-align: left; 
          margin: 0px; 
          background: #f1f3f4; 
         }
    textarea { width: 300px;
              height: 100px;
              margin-bottom: 20px;
              padding: 10px;
              font-size: 20px;
              cursor: text;}
    button { padding: 10px 10px;
            font-size: 20px;
            cursor: default;
            background-color: #4285f4;
            color: white;
            border: none;
           }
    button:hover { background-color: #f1f3f4; border-style: solid; border-color: #4285f4; color: #4285f4}
    
    .output { margin-top: 20px; font-size: 18px; color: #111827; min-height: 50px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">
      <span class="blue">G</span>
      <span class="red">e</span>
      <span class="yellow">n</span>
      <span class="blue">Z</span>
      <span class="translate-text"> Translate</span>
    </div>
  </div>
  <textarea id="inputText" placeholder="Type Gen Z slang here"></textarea><br>
  <button id="translateBtn">Translate</button>
  <div class="output" id="outputText"></div>

  <script src="script.js"></script>
</body>
</html>
