<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gen Z Translator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
    }

    /* Logo */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 24px;
    }

    .logo {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .blue { color: #4285F4; }
    .red { color: #EA4335; }
    .yellow { color: #FBBC05; }
    .green { color: #34A853; }

    .translate-text {
      color: #5f6368;
    }

    /* MAIN TRANSLATE CONTAINER */
    .translate-container {
      margin: 100px auto;
      width: 90%;
      max-width: 1200px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
      display: flex;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 12px 16px;
      font-size: 14px;
      color: #5f6368;
      border-bottom: 1px solid #e0e0e0;
    }

    .text {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      font-family: inherit;
    }

    .divider {
      width: 1px;
      background: #e0e0e0;
    }

    .actions {
      padding: 12px 16px;
      border-top: 1px solid #e0e0e0;
      display: flex;
      justify-content: flex-end;
    }

    button {
      padding: 8px 20px;
      font-size: 14px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e8f0fe;
      color: #4285f4;
      border: 1px solid #4285f4;
    }

    /* Mobile */
    @media (max-width: 800px) {
      .translate-container {
        flex-direction: column;
      }

      .divider {
        height: 1px;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Logo -->
  <div class="top-bar">
    <div class="logo">
      <span class="blue">G</span>
      <span class="red">e</span>
      <span class="yellow">n</span>
      <span class="blue">Z</span>
      <span class="translate-text"> Translate</span>
    </div>
  </div>

  <!-- Translator -->
  <div class="translate-container">

    <!-- LEFT PANEL -->
    <div class="panel">
      <div class="panel-header">Gen Z</div>
      <div class="text" id="inputText" placeholder="Type Gen Z slang here"></div>
      <div class="actions">
        <button id="translateBtn">Translate</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- RIGHT PANEL -->
    <div class="panel">
      <div class="panel-header">English</div>
      <div class="text" id="outputText">Translation</div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
