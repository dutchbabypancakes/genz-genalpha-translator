<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen Z Translator</title>
  <style>
    body { font-family: Arial, sans-serif; 
          text-align: left; 
          margin: 50px; 
          background: #f1f3f4; 
         }
    .top-bar {
    position: absolute;
    top: 20px;
    left: 24px;
  }

  .logo {
    font-size: 22px;
    font-weight: 500;
    font-family: Arial, sans-serif;
  }

  .blue { color: #4285F4; }
  .red { color: #EA4335; }
  .yellow { color: #FBBC05; }
  .green { color: #34A853; }

  .translate-text {
    color: #5f6368;
  }
    textarea { width: 80%; height: 100px; margin-bottom: 20px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #4f46e5; color: white; border: none; border-radius: 5px; }
    button:hover { background-color: #3730a3; }
    .output { margin-top: 20px; font-size: 18px; color: #111827; min-height: 50px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">
      <span class="blue">G</span>
      <span class="red">e</span>
      <span class="yellow">n</span>
      <span class="blue">Z</span>
      <span class="translate-text"> Translate</span>
    </div>
  </div>
  <textarea id="inputText" placeholder="Type Gen Z slang here"></textarea><br>
  <button id="translateBtn">Translate</button>
  <div class="output" id="outputText"></div>

  <script src="script.js"></script>
</body>
</html>
