<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gen Z → Gen Alpha Translator</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 50px; background: #f0f2f5; }
    textarea { width: 80%; height: 100px; margin-bottom: 20px; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #4f46e5; color: white; border: none; border-radius: 5px; }
    button:hover { background-color: #3730a3; }
    .output { margin-top: 20px; font-size: 18px; color: #111827; min-height: 50px; }
  </style>
</head>
<body>
  <h1>Gen Z → Gen Alpha Translator</h1>
  <textarea id="inputText" placeholder="Type Gen Z slang here..."></textarea><br>
  <button id="translateBtn">Translate</button>
  <div class="output" id="outputText"></div>

  <script src="script.js"></script>
</body>
</html>
